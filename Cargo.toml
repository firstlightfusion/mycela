[package]
name = "mycela"
version = "0.1.0"
edition = "2021"
authors = ["Tine Zata <https://github.com/TineZata>"]
description = "Distributed control system framework and UI widgets written in rust"
license = "MPL-2.0, Copyright (c) 2026 First Light Fusion Limited"
repository = "https://github.com/firstlightfusion/mycela"
keywords = ["control systems", "widgets", "ui", "gui", "dcs", "epics", "modbus"]
categories = ["development-tools", "science"]
readme = "README.md"
documentation = "https://docs.rs/mycela"
homepage = "https://github.com/firstlightfusion/mycela"

[[bin]]
name = "test-config-load"
path = "test_config_load.rs"

[[example]]
name = "demo_server"
path = "examples/demo_server/main.rs"
required-features = ["epics-pvxs", "modbus", "ascii-tcp"]

[[example]]
name = "demo_desktop"
path = "examples/demo_desktop/main.rs"
required-features = ["epics-pvxs", "modbus", "ascii-tcp", "desktop"]

[dependencies]
# Web framework
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }

# HTML templating
maud = { version = "0.27.0", features = ["axum"] }

# Data handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
image = "0.25"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2"

# Concurrent caching
dashmap = "6.2.1"

# Async streams (for SSE)
tokio-stream = "0.1.19"
futures = "0.3.34"
async-stream = "0.3"

# UTC Time handling
chrono = "0.4.45"

# Charting (SVG-only backend, minimal deps)
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "line_series"] }

# EPICS (optional — enable with feature "epics-rs")
pvxs = { version = "0.1.1", optional = true }

# Modbus (optional — enable with feature "modbus-tcp-client" or "modbus-tcp-server")
tokio-modbus = { version = "0.17.0", default-features = false, features = ["tcp"], optional = true }

# ASCII protocols (optional)
ascii-tcp = { version = "0.1.1", path = "../ascii-tcp", optional = true }
ascii-serial = { version = "0.1.0", optional = true }

# Desktop (optional — enable with feature "desktop")
wry   = { version = "0.55", optional = true }
winit = { version = "0.30", optional = true }
tao   = { version = "0.35.3", optional = true }

[features]
default = ["epics-pvxs", "modbus", "ascii-tcp"]
epics-pvxs     = ["dep:pvxs"]
modbus         = ["dep:tokio-modbus"]
modbus-server  = ["dep:tokio-modbus", "tokio-modbus/tcp-server"]
ascii-tcp      = ["dep:ascii-tcp"]
ascii-serial   = ["dep:ascii-serial"]
desktop        = ["dep:wry", "dep:winit", "dep:tao"]

[dev-dependencies]
rand = "0.10.2"

[profile.release]
opt-level = "z"
lto = true
